<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог новостроек</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="welcome" class="welcome">
    <img id="wLogo" class="w-logo" src="" alt="">
    <h1 id="wTitle" class="w-title">Загрузка...</h1>
    <p id="wSub" class="w-sub">Каталог новостроек Санкт-Петербурга</p>
    <button id="wBtn" class="btn-main">Открыть каталог</button>
  </div>

  <header id="header" class="header hidden">
    <img id="hLogo" src="" class="h-logo">
    <h1 id="hTitle" class="h-title"></h1>
  </header>

  <div id="filters" class="filters hidden">
    <select id="fRooms"><option value="all">Все комнаты</option><option value="Студия">Студии</option><option value="1">1-к</option><option value="2">2-к</option><option value="3">3-к</option></select>
    <select id="fPrice"><option value="all">Любая цена</option><option value="5">До 5 млн</option><option value="10">До 10 млн</option><option value="15">До 15 млн</option><option value="15+">От 15 млн</option></select>
  </div>

  <main id="list" class="list hidden"></main>

  <div id="modal" class="modal hidden">
    <div class="modal-body">
      <button class="close" onclick="closeModal()">×</button>
      <img id="mImg" class="m-img">
      <div class="m-info">
        <span id="mStatus" class="badge"></span>
        <h2 id="mTitle"></h2>
        <div id="mPrice" class="price"></div>
        <div id="mMeta" class="meta"></div>
        <p id="mDesc" class="desc"></p>
        <div id="mDetails" class="details"></div>
        <a id="mBtn" href="#" target="_blank" rel="noopener" class="btn-main">Оставить заявку</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
