<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог новостроек</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=2.0.8">
</head>
<body>
    <!-- Экран загрузки -->
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <p>Загрузка...</p>
    </div>

    <!-- Приветственный экран -->
    <div id="welcomeScreen" class="welcome-screen hidden">
        <div class="welcome-content">
            <div id="headerBrand" class="brand-logo-container">
                <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            </div>
            <h1 id="welcomeTitle">КАТАЛОГ НОВОСТРОЕК</h1>
            <p id="welcomeTagline">Подберём квартиру под ваш бюджет</p>
            <button id="welcomeButton" class="btn-primary" onclick="startApp()">НАЧАТЬ ПОДБОР</button>
        </div>
    </div>

    <!-- Основной контент -->
    <div id="mainContent" class="main-content hidden">
        <!-- Шапка -->
        <header class="header">
            <button id="headerBackBtn" class="back-btn hidden" onclick="appBack()">← Назад</button>
            <div id="headerBrand" class="brand-logo-container">
                <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            </div>
            <h1 id="headerTitle">КАТАЛОГ НОВОСТРОЕК</h1>
            <button class="menu-btn" onclick="openMenu()">☰</button>
        </header>

        <!-- Боковое меню -->
        <div id="menuOverlay" class="menu-overlay hidden" onclick="closeMenu()"></div>
        <div id="sideMenu" class="side-menu hidden">
            <div class="menu-header">
                <h3>Меню</h3>
                <button class="close-menu-btn" onclick="closeMenu()">✕</button>
            </div>
            <div class="menu-items">
                <a href="#" onclick="showPage('home'); return false;">🏠 Главная</a>
                <a href="#" onclick="showPage('about'); return false;">ℹ️ Обо мне</a>
                <a href="#" onclick="showPage('contacts'); return false;">📞 Контакты</a>
                <!-- ✅ ИСПРАВЛЕНО: добавлен &admin=1 для входа с телефона -->
                <a id="adminMenuItem" href="admin.html?agent=23062026-001&admin=1" style="display:none;">⚙️ Админка</a>
            </div>
        </div>

        <!-- Фильтры -->
        <div class="filters-container">
            <button class="filters-toggle-btn" onclick="toggleFilters()">🔽 Фильтры</button>
            <div id="filtersBlock" class="filters-block hidden">
                <div class="filter-section">
                    <h4>Район</h4>
                    <div id="districtCheckboxes" class="checkbox-group"></div>
                </div>
                <div class="filter-section">
                    <h4>Метро</h4>
                    <div id="metroCheckboxes" class="checkbox-group"></div>
                </div>
                <div class="filter-section">
                    <h4>Комнатность</h4>
                    <div id="roomsCheckboxes" class="checkbox-group"></div>
                </div>
                <div class="filter-section">
                    <h4>Цена</h4>
                    <div class="price-buttons">
                        <button class="price-btn" data-price="5000000">до 5 млн</button>
                        <button class="price-btn" data-price="10000000">до 10 млн</button>
                        <button class="price-btn" data-price="15000000">до 15 млн</button>
                        <button class="price-btn" data-price="20000000">до 20 млн</button>
                    </div>
                </div>
                <button class="btn-reset" onclick="resetFilters()">Сбросить фильтры</button>
            </div>
        </div>

        <!-- Переключатель вида -->
        <div class="view-switcher">
            <button id="listViewBtn" class="view-btn active" onclick="switchView('list')"> Список</button>
            <button id="mapViewBtn" class="view-btn" onclick="switchView('map')">🗺️ Карта</button>
        </div>

        <!-- Список объектов -->
        <div id="listingsContainer" class="listings-container"></div>

        <!-- Карта -->
        <div id="mapContainer" class="map-container hidden"></div>

        <!-- Страница "Обо мне" -->
        <div id="page-about" class="page-content-wrapper hidden">
            <div class="page-header"><h2>Обо мне</h2></div>
            <div class="page-content"></div>
        </div>

        <!-- Страница "Контакты" -->
        <div id="page-contacts" class="page-content-wrapper hidden">
            <div class="page-header"><h2>Контакты</h2></div>
            <div class="contacts-content">
                <div class="agent-card">
                    <div class="agent-avatar"></div>
                    <h3 id="agentName">Имя Агента</h3>
                    <p id="agentRole">Эксперт по недвижимости</p>
                    <div id="agencyBlock" class="agency-info" style="display:none;">
                        <p id="agencyName"></p>
                        <p id="agencyAddress"></p>
                    </div>
                    <div class="contact-buttons">
                        <button class="btn-contact" onclick="openDirectChat()">💬 Написать в Telegram</button>
                        <button class="btn-contact" onclick="callAgent()">📞 Позвонить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно деталей объекта -->
    <div id="detailsModal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2 id="modalTitle"></h2>
            <div id="modalPrice" class="modal-price"></div>
            <div id="modalMeta" class="modal-meta"></div>
            <div id="modalGallery" class="modal-gallery"></div>
            <div class="modal-section">
                <h3>Описание</h3>
                <p id="modalDescription"></p>
            </div>
            <div class="modal-section">
                <h3>Преимущества</h3>
                <div id="modalFeatures"></div>
            </div>
            <div id="modalFloorPlans" class="modal-section"></div>
        </div>
    </div>

    <!-- Модальное окно консультации -->
    <div id="consultModal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeConsultModal()">✕</button>
            <h2>Заявка на консультацию</h2>
            <p id="consultObjectName" class="consult-object-name"></p>
            <form id="consultForm" onsubmit="submitConsultForm(event)">
                <div class="form-group">
                    <label>Ваше имя *</label>
                    <input type="text" id="consultName" required>
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" id="consultPhone" required>
                </div>
                <div class="form-group">
                    <label>Telegram (необязательно)</label>
                    <input type="text" id="consultTelegram" placeholder="@username">
                </div>
                <button type="submit" class="btn-primary">Отправить заявку</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js?v=2.0.8"></script>
</body>
</html>
