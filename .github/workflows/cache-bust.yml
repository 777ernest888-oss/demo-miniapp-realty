name: Auto Cache Busting
on:
  push:
    branches: [ main ]

jobs:
  update-version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
     
      - name: Get short commit hash
        run: echo "HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
       
      - name: Replace placeholder in index.html
        run: sed -i "s/__CACHE_BUSTER__/${{ env.HASH }}/g" index.html
       
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update cache version [skip ci]"
          git push
