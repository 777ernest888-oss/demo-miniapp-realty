<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
<h1>Диагностика v3</h1>
<div id="result">Загрузка...</div>
<script>
fetch('/client-config.json?v=' + Date.now())
  .then(r => r.json())
  .then(c => {
    var api = c.client.apiUrl || 'НЕ НАЙДЕНО';
    document.getElementById('result').innerText =
      'Config: OK\n' +
      'apiUrl: ' + api + '\n' +
      'scriptUrl: ' + (c.client.scriptUrl || 'НЕТ') + '\n' +
      'Все ключи client: ' + Object.keys(c.client).join(', ');
  })
  .catch(e => {
    document.getElementById('result').innerText = 'ERROR: ' + e.message;
  });
</script>
</body>
</html>
