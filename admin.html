<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админка | Новостройки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #3D5266;
            --accent: #3498DB;
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
            --text-secondary: #7F8C8D;
            --border: #E0E6ED;
            --danger: #E74C3C;
            --success: #27AE60;
            --warning: #F39C12;
            --radius: 12px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
       
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }
       
        .header {
            background: var(--primary);
            color: white;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 4px 8px; }

        .tabs {
            display: flex;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 56px;
            z-index: 99;
        }        .tab {
            flex: 1;
            padding: 12px 8px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }
        .tab-content { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }

        .object-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .object-card:active { transform: scale(0.98); }
        .object-card.hidden-object { opacity: 0.5; }
       
        .card-thumb {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }
       
        .card-info { flex: 1; min-width: 0; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-address { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-status {             font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 4px;
        }
        .status-active { background: #E8F8F0; color: var(--success); }
        .status-hidden { background: #FEF5E7; color: var(--warning); }

        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
            cursor: pointer;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
       
        .modal-content {
            background: var(--bg);
            width: 100%;
            max-height: 90vh;
            border-radius: 16px 16px 0 0;
            overflow-y: auto;
            padding: 20px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header {            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }
        .modal-header h2 { font-size: 20px; flex: 1; text-align: center; }
        .close-btn { background: none; border: none; font-size: 24px; color: var(--text-secondary); cursor: pointer; }
       
        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            white-space: nowrap;
        }
        .back-btn:active { opacity: 0.7; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--card-bg);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
        .form-textarea { resize: vertical; min-height: 80px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }

        .photo-section { margin-bottom: 16px; }
        .photo-preview-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .photo-thumb {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;            position: relative;
            border: 1px solid var(--border);
        }
        .photo-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: var(--card-bg);
            border: 1px dashed var(--accent);
            border-radius: 8px;
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
        .upload-btn input { display: none; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; margin-top: 16px; }
        .btn-secondary { background: var(--border); color: var(--text); margin-top: 16px; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .status-toggle { display: flex; gap: 8px; margin-bottom: 16px; }        .toggle-option {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: var(--card-bg);
        }
        .toggle-option.selected { border-color: var(--accent); background: #EBF5FB; color: var(--accent); font-weight: 600; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }

        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 300;
            display: none;
        }
        .toast.show { display: block; animation: fadeInOut 3s ease; }
        @keyframes fadeInOut { 0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

        .profile-photo-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border);
            margin: 0 auto 16px;
            display: block;
            background: var(--border);
        }
        .profile-photo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .lead-card {
            background: var(--card-bg);            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--accent);
        }
        .lead-card.status-new { border-left-color: var(--accent); }
        .lead-card.status-progress { border-left-color: var(--warning); }
        .lead-card.status-closed { border-left-color: var(--success); opacity: 0.7; }
       
        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .lead-object { font-weight: 600; font-size: 15px; }
        .lead-date { font-size: 12px; color: var(--text-secondary); }
        .lead-body { font-size: 14px; line-height: 1.6; }
        .lead-body div { margin-bottom: 4px; }
        .lead-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .lead-status-btn {
            flex: 1;
            min-width: 80px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }
        .lead-status-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .lead-status-btn.status-new.active { background: var(--accent); border-color: var(--accent); }
        .lead-status-btn.status-progress.active { background: var(--warning); border-color: var(--warning); }
        .lead-status-btn.status-closed.active { background: var(--success); border-color: var(--success); }

        .leads-filter {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--card-bg);
            font-size: 13px;
            cursor: pointer;
        }
        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏗️ Админка</h1>
        <button class="header-btn" onclick="refreshCurrentTab()">↻</button>
    </div>

    <nav class="tabs">
        <button class="tab active" data-tab="objects" onclick="switchTab('objects')">📋 Объекты</button>
        <button class="tab" data-tab="profile" onclick="switchTab('profile')">👤 Профиль</button>
        <button class="tab" data-tab="leads" onclick="switchTab('leads')">📨 Заявки</button>
    </nav>

    <div id="tab-objects" class="tab-content active">
        <div class="loading" id="objectsLoading">Загрузка объектов...</div>
        <div id="objectsList"></div>
    </div>

    <div id="tab-profile" class="tab-content">
        <div class="loading" id="profileLoading">Загрузка профиля...</div>
       
        <form id="profileForm" style="display:none;">
            <div class="profile-photo-container">
                <img id="profilePhotoPreview" class="profile-photo-preview" src="" alt="Фото агента">
                <label class="upload-btn">
                    📷 Изменить фото
                    <input type="file" accept="image/*" onchange="uploadAgentPhoto(this)">
                </label>
                <input type="hidden" id="profilePhotoUrl">
            </div>

            <div class="form-group">
                <label class="form-label">Имя *</label>                <input type="text" class="form-input" id="profileName" placeholder="Эрнест Гареев" required>
            </div>
            <div class="form-group">
                <label class="form-label">Роль / Должность</label>
                <input type="text" class="form-input" id="profileRole" placeholder="Эксперт по недвижимости">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="tel" class="form-input" id="profilePhone" placeholder="+7 (999) 123-45-67">
                </div>
                <div class="form-group">
                    <label class="form-label">Telegram</label>
                    <input type="text" class="form-input" id="profileTelegram" placeholder="username (без @)">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Название агентства</label>
                <input type="text" class="form-input" id="profileAgency" placeholder="Название АН">
            </div>
            <div class="form-group">
                <label class="form-label">Адрес офиса</label>
                <input type="text" class="form-input" id="profileAgencyAddress" placeholder="г. Санкт-Петербург, ул. ...">
            </div>

            <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--border);">

            <h3 style="margin-bottom: 16px; font-size: 18px;">📝 Страница "Обо мне"</h3>
            <div class="form-group">
                <label class="form-label">Заголовок</label>
                <input type="text" class="form-input" id="pageAboutTitle" placeholder="Обо мне">
            </div>
            <div class="form-group">
                <label class="form-label">Содержание (поддерживается HTML: <b>, <br>, <ul>, <li>)</label>
                <textarea class="form-textarea" id="pageAboutContent" rows="10" placeholder="Привет! Я — профессиональный брокер..."></textarea>
            </div>

            <button type="button" class="btn btn-primary" onclick="saveProfile()">💾 Сохранить профиль</button>
        </form>
    </div>

    <div id="tab-leads" class="tab-content">
        <div class="loading" id="leadsLoading">Загрузка заявок...</div>
       
        <div id="leadsFilterContainer" class="leads-filter" style="display:none;">
            <button class="filter-btn active" data-filter="all" onclick="filterLeads('all')">Все</button>
            <button class="filter-btn" data-filter="new" onclick="filterLeads('new')">🔵 Новые</button>
            <button class="filter-btn" data-filter="progress" onclick="filterLeads('progress')">🟡 В работе</button>
            <button class="filter-btn" data-filter="closed" onclick="filterLeads('closed')">🟢 Закрыты</button>
        </div>       
        <div id="leadsList"></div>
    </div>

    <button class="fab" id="fabAdd" onclick="openCreateModal()">+</button>

    <div class="modal-overlay" id="objectModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="back-btn" onclick="closeModal()">← Назад</button>
                <h2 id="modalTitle">Новый объект</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="status-toggle" id="statusToggle" style="display:none;">
                <div class="toggle-option selected" data-value="true" onclick="setStatus('true')">✅ Активен</div>
                <div class="toggle-option" data-value="false" onclick="setStatus('false')">👁️ Скрыт</div>
            </div>

            <form id="objectForm" onsubmit="saveObject(event)">
                <input type="hidden" id="objectId">
               
                <div class="form-group">
                    <label class="form-label">Название *</label>
                    <input type="text" class="form-input" id="fieldName" placeholder="Например: ЖК Агасфера" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Адрес *</label>
                    <input type="text" class="form-input" id="fieldAddress" placeholder="Введите адрес объекта" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Район</label>
                        <input type="text" class="form-input" id="fieldDistrict" placeholder="Введите район">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Метро</label>
                        <input type="text" class="form-input" id="fieldMetro" placeholder="Станция метро">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Цена от (млн ₽)</label>
                        <input type="number" step="0.1" class="form-input" id="fieldPriceFrom" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Цена до (млн ₽)</label>
                        <input type="number" step="0.1" class="form-input" id="fieldPriceTo" placeholder="0">
                    </div>                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Площадь от (м²)</label>
                        <input type="number" step="0.1" class="form-input" id="fieldAreaMin" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Площадь до (м²)</label>
                        <input type="number" step="0.1" class="form-input" id="fieldAreaMax" placeholder="0">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Цена за м² (₽)</label>
                    <input type="number" class="form-input" id="fieldPriceSqm" placeholder="Рассчитается автоматически или введите вручную">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Комнатность</label>
                        <input type="text" class="form-input" id="fieldRooms" placeholder="Студия, 1, 2, 3...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Класс</label>
                        <select class="form-select" id="fieldClass">
                            <option value="">Выберите класс</option>
                            <option value="Эконом">Эконом</option>
                            <option value="Комфорт">Комфорт</option>
                            <option value="Бизнес">Бизнес</option>
                            <option value="Премиум">Премиум</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Срок сдачи (начало)</label>
                        <input type="text" class="form-input" id="fieldCompletionSoonest" placeholder="IV кв. 2026">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Срок сдачи (конец)</label>
                        <input type="text" class="form-input" id="fieldCompletionAll" placeholder="II кв. 2027">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Отделка</label>
                    <select class="form-select" id="fieldFinishing">
                        <option value="">Выберите отделку</option>
                        <option value="Черновая">Черновая</option>
                        <option value="Предчистовая">Предчистовая</option>
                        <option value="Чистовая">Чистовая</option>
                        <option value="Под ключ">Под ключ</option>                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Статус стройки</label>
                    <select class="form-select" id="fieldStatus">
                        <option value="">Выберите статус</option>
                        <option value="Строится">Строится</option>
                        <option value="Сдан">Сдан</option>
                        <option value="Частично сдан">Частично сдан</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea class="form-textarea" id="fieldDescription" placeholder="Расскажите о проекте"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Преимущества (через запятую)</label>
                    <input type="text" class="form-input" id="fieldFeatures" placeholder="Паркинг, охрана, двор без машин">
                </div>

                <div class="photo-section">
                    <label class="form-label">Главное фото *</label>
                    <div class="photo-preview-area" id="mainPhotoPreview"></div>
                    <label class="upload-btn">
                        📷 Выбрать фото
                        <input type="file" accept="image/*" onchange="uploadPhoto('main', this)">
                    </label>
                    <input type="hidden" id="fieldImageMain">
                </div>

                <div class="photo-section">
                    <label class="form-label">Галерея</label>
                    <div class="photo-preview-area" id="galleryPreview"></div>
                    <label class="upload-btn">
                        🖼️ Добавить фото
                        <input type="file" accept="image/*" multiple onchange="uploadPhoto('gallery', this)">
                    </label>
                    <input type="hidden" id="fieldImagesGallery">
                </div>

                <div class="photo-section">
                    <label class="form-label">Планировки</label>
                    <div class="photo-preview-area" id="plansPreview"></div>
                    <label class="upload-btn">
                        📐 Добавить планировку
                        <input type="file" accept="image/*" multiple onchange="uploadPhoto('plans', this)">
                    </label>
                    <input type="hidden" id="fieldFloorPlansImages">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Широта</label>
                        <input type="number" step="any" class="form-input" id="fieldLat" placeholder="59.9343">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Долгота</label>
                        <input type="number" step="any" class="form-input" id="fieldLng" placeholder="30.3351">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="saveBtn">Сохранить объект</button>
                <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;" onclick="deleteObject()">Удалить объект</button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var config = { scriptUrl: '', pin: '' };
        var objects = [];
        var leads = [];
        var currentLeadFilter = 'all';
        var currentEditId = null;
        var photoStore = { main: '', gallery: [], plans: [] };
        var currentStatus = 'true';
        var currentTab = 'objects';
        var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

        if (tg) {
            console.log('[ADMIN] Telegram WebApp detected');
            tg.ready();
            tg.expand();
        } else {
            console.log('[ADMIN] Running outside Telegram');
        }

        function switchTab(tabName) {
            currentTab = tabName;
           
            document.querySelectorAll('.tab').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });
           
            document.querySelectorAll('.tab-content').forEach(function(content) {
                content.classList.remove('active');
            });

        // ИСПРАВЛЕНО: Вернул no-cors и application/json
        async function apiCall(action, params) {
            console.log('[API] Calling:', action);
            if (!config.scriptUrl) throw new Error('Script URL не настроен');

            var payload = Object.assign({}, params, {
                action: action,
                pin: config.pin,
                type: 'listing'
            });

            console.log('[API] Sending payload...');

            try {
                await fetch(config.scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });               
                console.log('[API] Request sent successfully');
                return { success: true };
            } catch (e) {
                console.error('[API] Error:', e);
                throw e;
            }
        }

        async function apiGet(action) {
            console.log('[API-GET] Calling:', action);
            if (!config.scriptUrl) throw new Error('Script URL не настроен');
           
            var url = config.scriptUrl + '?action=' + action;
            console.log('[API-GET] URL:', url.substring(0, 100) + '...');
           
            var response = await fetch(url);
            console.log('[API-GET] Response status:', response.status);
           
            if (!response.ok) throw new Error('Network error: ' + response.status);
            return await response.json();
        }

        async function fetchData() {
            console.log('[FETCH] Getting objects...');
            if (!config.scriptUrl) return [];
            try {
                var url = config.scriptUrl + '?type=listings&includeHidden=true';
                var response = await fetch(url);
               
                if (!response.ok) throw new Error('Network error: ' + response.status);
               
                var data = await response.json();
               
                if (Array.isArray(data) && data.length > 1) {
                    var headers = data[0];
                    var rows = data.slice(1);
                    console.log('[FETCH] Rows count:', rows.length);
                   
                    return rows.map(function(row) {
                        var obj = {};
                        headers.forEach(function(header, i) {
                            obj[header] = row[i];
                        });
                        return obj;
                    });
                }
                return [];
            } catch (e) {
                console.error('[FETCH] Error:', e);                return [];
            }
        }

        async function uploadPhoto(type, input) {
            if (!input.files || input.files.length === 0) {
                await new Promise(r => setTimeout(r, 100));
                if (!input.files || input.files.length === 0) return;
            }

            var files = Array.from(input.files);
            var btn = input.parentElement;
            var originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Загрузка...';

            try {
                for (var i = 0; i < files.length; i++) {
                    var file = files[i];
                    var base64 = await fileToBase64(file);
                   
                    await apiCall('upload_image', {
                        image: base64,
                        fileName: file.name
                    });

                    await new Promise(r => setTimeout(r, 2000));
                   
                    var urlResponse = await fetch(config.scriptUrl + '?action=get_last_file_url');                    var urlData = await urlResponse.json();
                   
                    if (urlData && urlData.url) {
                        addPhotoToField(type, urlData.url);
                    } else {
                        showToast('⚠️ Фото загружено, но URL не получен');
                    }
                }
                showToast('✅ Фото загружено');
            } catch (e) {
                console.error('[UPLOAD] Error:', e);
                showToast('❌ Ошибка загрузки фото');
            } finally {
                btn.innerHTML = originalText;
                input.value = '';
            }
        }

        function fileToBase64(file) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function() { resolve(reader.result); };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function addPhotoToField(type, url) {
            if (type === 'main') {
                photoStore.main = url;
                document.getElementById('fieldImageMain').value = url;
                renderPhotoPreview('main', [url]);
            } else if (type === 'gallery') {
                if (photoStore.gallery.indexOf(url) === -1) {
                    photoStore.gallery.push(url);
                }
                document.getElementById('fieldImagesGallery').value = photoStore.gallery.join(',');
                renderPhotoPreview('gallery', photoStore.gallery);
            } else if (type === 'plans') {
                if (photoStore.plans.indexOf(url) === -1) {
                    photoStore.plans.push(url);
                }
                document.getElementById('fieldFloorPlansImages').value = photoStore.plans.join(',');
                renderPhotoPreview('plans', photoStore.plans);
            }
        }

        function removePhoto(type, index) {
            if (type === 'main') {
                photoStore.main = '';                document.getElementById('fieldImageMain').value = '';
                renderPhotoPreview('main', []);
            } else if (type === 'gallery') {
                photoStore.gallery.splice(index, 1);
                document.getElementById('fieldImagesGallery').value = photoStore.gallery.join(',');
                renderPhotoPreview('gallery', photoStore.gallery);
            } else if (type === 'plans') {

        }

        function renderPhotoPreview(type, urls) {
            var containerId = type === 'main' ? 'mainPhotoPreview' : type === 'gallery' ? 'galleryPreview' : 'plansPreview';
            var container = document.getElementById(containerId);
            container.innerHTML = '';

            urls.forEach(function(url, index) {
                if (!url) return;
               
                var displayUrl = url;
                if (url.indexOf('lh3.googleusercontent.com/d/') !== -1) {
                    var fileId = url.split('/d/')[1];
                    if (fileId) displayUrl = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w400';
                }
               
                var wrapper = document.createElement('div');
                wrapper.style.position = 'relative';
                wrapper.style.display = 'inline-block';
               
                var img = document.createElement('img');
                img.src = displayUrl;
                img.className = 'photo-thumb';
                img.onerror = function() {
                    this.onerror = null;
                    this.style.background = '#E0E6ED';
                    this.src = '';
                };
               
                var removeBtn = document.createElement('button');
                removeBtn.className = 'photo-remove';
                removeBtn.textContent = '✕';
                removeBtn.onclick = function(e) { e.stopPropagation(); removePhoto(type, index); };

                wrapper.appendChild(img);
                wrapper.appendChild(removeBtn);
                container.appendChild(wrapper);
            });
        }

        function renderLeads() {
            var listEl = document.getElementById('leadsList');
            listEl.innerHTML = '';

            var filtered = leads;
            if (currentLeadFilter !== 'all') {
                filtered = leads.filter(function(lead) {
                    return (lead.status || 'new') === currentLeadFilter;
                });
            }

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📨</div><h3>Нет заявок</h3></div>';
                return;
            }

            filtered.sort(function(a, b) {
                var dateA = a.timestamp || a.created_at || '';
                var dateB = b.timestamp || b.created_at || '';
                return dateB.localeCompare(dateA);
            });

            filtered.forEach(function(lead, index) {
                var status = lead.status || 'new';
                var statusClass = 'status-' + status;
                var dateStr = lead.timestamp || lead.created_at || '';
                if (dateStr) {                    try {
                        var d = new Date(dateStr);
                        dateStr = d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    } catch(e) {}
                }

                var card = document.createElement('div');
                card.className = 'lead-card ' + statusClass;
                card.innerHTML =
                    '<div class="lead-header">' +
                        '<div class="lead-object">🏢 ' + escapeHtml(lead.objectName || lead.title || 'Объект не указан') + '</div>' +
                        '<div class="lead-date">' + escapeHtml(dateStr) + '</div>' +
                    '</div>' +
                    '<div class="lead-body">' +
                        '<div>👤 <b>' + escapeHtml(lead.clientName || lead.leadname || 'Не указано') + '</b></div>' +
                        '<div>📞 ' + escapeHtml(lead.clientPhone || lead.leadphone || 'Не указан') + '</div>' +
                        (lead.clientTelegram || lead.leadtelegram ? '<div>💬 ' + escapeHtml(lead.clientTelegram || lead.leadtelegram) + '</div>' : '') +
                    '</div>' +
                    '<div class="lead-actions">' +
                        '<button class="lead-status-btn status-new ' + (status === 'new' ? 'active' : '') + '" onclick="updateLeadStatus(\'' + (lead.id || index) + '\', \'new\')">🔵 Новая</button>' +
                        '<button class="lead-status-btn status-progress ' + (status === 'progress' ? 'active' : '') + '" onclick="updateLeadStatus(\'' + (lead.id || index) + '\', \'progress\')">🟡 В работе</button>' +
                        '<button class="lead-status-btn status-closed ' + (status === 'closed' ? 'active' : '') + '" onclick="updateLeadStatus(\'' + (lead.id || index) + '\', \'closed\')">🟢 Закрыта</button>' +
                    '</div>';
                listEl.appendChild(card);
            });
        }

        async function updateLeadStatus(leadId, newStatus) {
            console.log('[LEADS] Updating status:', leadId, newStatus);
           
            var lead = leads.find(function(l) { return String(l.id) === String(leadId); });
            if (!lead) {
                var idx = parseInt(leadId);
                if (!isNaN(idx) && leads[idx]) lead = leads[idx];
            }
           
            if (!lead) {
                showToast('❌ Заявка не найдена');
                return;
            }

            try {
                await apiCall('update_lead_status', {
                    id: lead.id,
                    status: newStatus
                });
               
                lead.status = newStatus;
                renderLeads();
                showToast('✅ Статус обновлён');               
            } catch (e) {
                console.error('[LEADS STATUS] Error:', e);
                showToast('❌ Ошибка обновления статуса');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('show');
            void toast.offsetWidth;
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('[INIT] DOM loaded');
            loadConfig().then(function() {
                loadObjects();
            });
        });

        document.getElementById('objectModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
